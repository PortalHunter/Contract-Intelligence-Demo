name: Publish synthetic demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-contract-demo-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Verify public-only synthetic demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public demo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Enforce static synthetic-only publishing boundary
        run: python scripts/verify_public_demo.py
      - name: Exercise synthetic PDFs and matrix in a mocked browser
        run: node scripts/test_browser_demo.cjs
      - name: Validate rendered PDF pages and extractable contract text
        run: |
          node scripts/export_visual_contracts.cjs
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
          for file in preview-artifacts/*.pdf; do
            echo "Checking $file"
            pages=$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')
            test "$pages" = "100"
            pdftotext -f 1 -l 100 "$file" "${file%.pdf}.txt"
            grep -q 'CONTRACT AWARD' "${file%.pdf}.txt"
            grep -q 'TABLE OF CONTENTS' "${file%.pdf}.txt"
            grep -q 'TASK / RECORDS CROSSWALK' "${file%.pdf}.txt"
            pdftoppm -f 1 -l 1 -singlefile -scale-to 1100 -png "$file" "${file%.pdf}-cover"
            pdftoppm -f 38 -l 38 -singlefile -scale-to 1100 -png "$file" "${file%.pdf}-workpage"
          done
      - name: Retain synthetic PDF visual review samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-contract-preview-packages
          path: preview-artifacts/
          retention-days: 7
      - name: Package validated public-only site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public demo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
